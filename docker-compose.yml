services:
  config-server:
    build:
      context: ./packages/config-server/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: config-server-0.0.1-SNAPSHOT.jar
    image: chatapp/config-server:${VERSION:-latest}
    ports:
      - 127.0.0.1:8888:8080
      - 127.0.0.1:8840:8010
    networks:
      - servicenet
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - TZ=${TZ:-Asia/Dhaka}
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx64M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=96m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 200M

  discovery-server:
    build:
      context: ./packages/discovery-server/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: discovery-server-0.0.1-SNAPSHOT.jar
    image: chatapp/discovery-server:${VERSION:-latest}
    ports:
      - 127.0.0.1:8761:8080
      - 127.0.0.1:8841:8010
    networks:
      - servicenet
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - spring.config.import=optional:configserver:http://config-server:8080
      - eureka.client.register-with-eureka=false
      - eureka.client.fetch-registry=false
      - TZ=${TZ:-Asia/Dhaka}
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx64M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=96m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 200M

  api-gateway:
    build:
      context: ./packages/api-gateway/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: api-gateway-0.0.1-SNAPSHOT.jar
    image: chatapp/api-gateway:${VERSION:-latest}
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:8842:8010
    networks:
      - servicenet
      - redisnet
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - spring.config.import=optional:configserver:http://config-server:8080
      - eureka.client.service-url.defaultZone=http://discovery-server:8080/eureka/
      - jwt.secret=${JWT_SECRET}
      - TZ=${TZ:-Asia/Dhaka}
      - server.tomcat.max-threads=20
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx64M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=96m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    depends_on:
      discovery-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 200M

  auth-service:
    build:
      context: ./packages/auth-service/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: auth-service-0.0.1-SNAPSHOT.jar
    image: chatapp/auth-service:${VERSION:-latest}
    ports:
      - 127.0.0.1:8081:8080
      - 127.0.0.1:8843:8010
    networks:
      - servicenet
      - dbnet
      - kafkanet
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - spring.config.import=optional:configserver:http://config-server:8080
      - spring.datasource.url=jdbc:postgresql://postgres:5432/chatapp_auth
      - spring.datasource.username=${DB_USERNAME}
      - spring.datasource.password=${DB_PASSWORD}
      - spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
      - eureka.client.service-url.defaultZone=http://discovery-server:8080/eureka/
      - jwt.secret=${JWT_SECRET}
      - USER_SERVICE_BASE_URL=http://user-service:8080
      - TZ=${TZ:-Asia/Dhaka}
      - server.tomcat.max-threads=20
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx128M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M

  user-service:
    build:
      context: ./packages/user-service/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: user-service-0.0.1-SNAPSHOT.jar
    image: chatapp/user-service:${VERSION:-latest}
    ports:
      - 127.0.0.1:8082:8080
      - 127.0.0.1:8844:8010
    networks:
      - servicenet
      - dbnet
      - kafkanet
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - spring.config.import=optional:configserver:http://config-server:8080
      - spring.datasource.url=jdbc:postgresql://postgres:5432/chatapp_users
      - spring.datasource.username=${DB_USERNAME}
      - spring.datasource.password=${DB_PASSWORD}
      - spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
      - eureka.client.service-url.defaultZone=http://discovery-server:8080/eureka/
      - TZ=${TZ:-Asia/Dhaka}
      - server.tomcat.max-threads=20
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx128M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M

  chat-service:
    build:
      context: ./packages/chat-service/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: chat-service-0.0.1-SNAPSHOT.jar
    image: chatapp/chat-service:${VERSION:-latest}
    ports:
      - 127.0.0.1:8083:8080
      - 127.0.0.1:8845:8010
    networks:
      - servicenet
      - mongonet
      - kafkanet
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - spring.config.import=optional:configserver:http://config-server:8080
      - spring.data.mongodb.uri=mongodb://mongodb:27017/chatapp_messages
      - spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
      - eureka.client.service-url.defaultZone=http://discovery-server:8080/eureka/
      - TZ=${TZ:-Asia/Dhaka}
      - server.tomcat.max-threads=20
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx128M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    depends_on:
      discovery-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M

  notification-service:
    build:
      context: ./packages/notification-service/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: notification-service-0.0.1-SNAPSHOT.jar
    image: chatapp/notification-service:${VERSION:-latest}
    ports:
      - 127.0.0.1:8084:8080
      - 127.0.0.1:8846:8010
    networks:
      - servicenet
      - mongonet
      - kafkanet
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - spring.config.import=optional:configserver:http://config-server:8080
      - spring.data.mongodb.uri=mongodb://mongodb:27017/chatapp_notifications
      - spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
      - eureka.client.service-url.defaultZone=http://discovery-server:8080/eureka/
      - TZ=${TZ:-Asia/Dhaka}
      - server.tomcat.max-threads=20
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx64M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=96m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    depends_on:
      discovery-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 200M

  presence-service:
    build:
      context: ./packages/presence-service/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: presence-service-0.0.1-SNAPSHOT.jar
    image: chatapp/presence-service:${VERSION:-latest}
    ports:
      - 127.0.0.1:8085:8080
      - 127.0.0.1:8847:8010
    networks:
      - servicenet
      - redisnet
      - kafkanet
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - spring.config.import=optional:configserver:http://config-server:8080
      - spring.data.redis.host=redis
      - spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
      - eureka.client.service-url.defaultZone=http://discovery-server:8080/eureka/
      - TZ=${TZ:-Asia/Dhaka}
      - server.tomcat.max-threads=20
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx64M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=96m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 200M

  media-service:
    build:
      context: ./packages/media-service/
      dockerfile: ../../infrastructure/docker/Dockerfile
      args:
        JAR_FILE: media-service-0.0.1-SNAPSHOT.jar
    image: chatapp/media-service:${VERSION:-latest}
    ports:
      - 127.0.0.1:8086:8080
      - 127.0.0.1:8848:8010
    networks:
      - servicenet
      - dbnet
      - kafkanet
    volumes:
      - type: bind
        source: ${HOST_STORAGE_PATH:-./storage}
        target: /storage
    environment:
      - spring.profiles.active=${ACTIVE_PROFILES}
      - spring.config.import=optional:configserver:http://config-server:8080
      - spring.datasource.url=jdbc:postgresql://postgres:5432/chatapp_media
      - spring.datasource.username=${DB_USERNAME}
      - spring.datasource.password=${DB_PASSWORD}
      - spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
      - eureka.client.service-url.defaultZone=http://discovery-server:8080/eureka/
      - media.storage.location=/storage
      - TZ=${TZ:-Asia/Dhaka}
      - server.tomcat.max-threads=20
      - JDK_JAVA_OPTIONS=
        -XX:+UseContainerSupport
        -Xmx128M
        -Xss512k
        -XX:MaxDirectMemorySize=32m
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=16m
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8010
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M

  # --- Infrastructure ---
  postgres:
    image: postgres:17
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - dbnet
    environment:
      - POSTGRES_USER=${DB_USERNAME:-chatapp}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-chatapp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  mongodb:
    image: mongo:8.0
    ports:
      - 127.0.0.1:27017:27017
    networks:
      - mongonet
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - redisnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    ports:
      - 127.0.0.1:9092:9092
    networks:
      - kafkanet
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  servicenet: null
  dbnet: null
  mongonet: null
  redisnet: null
  kafkanet: null

volumes:
  postgres-data:
  mongo-data:

databaseChangeLog:
  - changeSet:
      id: 001-create-user-profiles
      author: marzuk
      changes:
        - createTable:
            tableName: user_profiles
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: display_name
                  type: varchar(100)
              - column:
                  name: avatar_url
                  type: varchar(500)
              - column:
                  name: bio
                  type: varchar(500)
              - column:
                  name: status_message
                  type: varchar(200)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

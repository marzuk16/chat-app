databaseChangeLog:
  - changeSet:
      id: 001-create-media-metadata
      author: marzuk
      changes:
        - createTable:
            tableName: media_metadata
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: original_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: stored_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: storage_path
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: thumbnail_path
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

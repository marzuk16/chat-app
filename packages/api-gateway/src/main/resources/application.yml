spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  public-key: ${JWT_PUBLIC_KEY}

app:
  authorizer:
    mode: gateway
    public-paths:
      - /api/auth/**
      - /actuator/health
